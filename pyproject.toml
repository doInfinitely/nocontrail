[project]
name = "contrail"
version = "0.0.1"
description = "Audit and scrub aircraft-Doppler location leaks in your own recordings"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[project.urls]
Homepage = "https://nocontrail.audio"
Repository = "https://github.com/doInfinitely/nocontrail"
dependencies = ["numpy>=1.24", "scipy>=1.10"]

[project.scripts]
contrail = "contrail.cli:main"

[project.optional-dependencies]
plot = ["matplotlib>=3.7"]
dev = ["pytest"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["contrail*"]
